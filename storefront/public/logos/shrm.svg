<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100" fill="none" role="img" aria-label="Society for Human Resource Management (SHRM) Recertification Provider Logo">
  <defs>
    <linearGradient id="shrmPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="320" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- SHRM Emblem -->
  <g transform="translate(14, 14)">
    <rect x="2" y="2" width="68" height="68" rx="14" fill="url(#shrmPurple)"/>
    <rect x="5" y="5" width="62" height="62" rx="11" fill="none" stroke="url(#purpleAccent)" stroke-width="1.5"/>
    
    <!-- Stylized Human Figures / Network Icon -->
    <circle cx="36" cy="24" r="6" fill="#F3E8FF"/>
    <path d="M22 46c0-7.7 6.3-14 14-14s14 6.3 14 14v4H22v-4z" fill="#F3E8FF"/>
    <circle cx="24" cy="30" r="3.5" fill="#C084FC" fill-opacity="0.8"/>
    <circle cx="48" cy="30" r="3.5" fill="#C084FC" fill-opacity="0.8"/>
  </g>

  <!-- Typography -->
  <g transform="translate(94, 20)">
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#581C87" letter-spacing="1.5">SHRM</text>
    <rect x="84" y="8" width="1" height="18" fill="#CBD5E1"/>
    <text x="92" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#1E293B" letter-spacing="0.4">SHRM RECERTIFICATION</text>
    <text x="92" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#9333EA" letter-spacing="0.8">PROVIDER</text>
    
    <!-- Subtitle Banner -->
    <rect x="0" y="38" width="210" height="20" rx="4" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="0.8"/>
    <text x="8" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#6B21A8" letter-spacing="0.2">OFFICIAL PDC RECERTIFICATION</text>
  </g>
</svg>
